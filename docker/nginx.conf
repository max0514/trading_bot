# Read-only static server for the twlab Parquet store (the `store` service).
# Research machines set TWLAB_SERVER_URL=http://<host>:8787 and data.get()
# syncs <dataset>/manifest.json and <dataset>/<field>.parquet through a local cache.
server {
    listen 80;
    root /srv/twlab;
    autoindex on;
    autoindex_format json;
    charset utf-8;

    # Manifests drive freshness checks: never let a proxy serve a stale one.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
